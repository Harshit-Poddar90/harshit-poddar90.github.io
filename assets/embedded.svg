<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img"
     aria-label="ESP32 board fusing gas, GPS and pulse sensors, transmitting over LoRaWAN to a gateway, alongside a high-altitude fall-detection trigger chain.">
  <defs>
    <marker id="es-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#7a6a62"/>
    </marker>
    <clipPath id="es-frame"><rect width="640" height="320" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#es-frame)" font-family="ui-monospace, 'Fira Code', monospace">
    <rect width="640" height="320" fill="#0d0b0a"/>
    <g stroke="#c9724f" stroke-opacity="0.06">
      <path d="M0 40h640M0 80h640M0 120h640M0 160h640M0 200h640M0 240h640M0 280h640"/>
      <path d="M40 0v320M120 0v320M200 0v320M280 0v320M360 0v320M440 0v320M520 0v320M600 0v320"/>
    </g>

    <text x="20" y="28" font-size="10" letter-spacing="1.6" fill="#8a7a72">SENSOR FUSION &#8594; LORAWAN TELEMETRY</text>
    <path d="M20 38h600" stroke="#3a2f2a"/>

    <!-- sensors -->
    <g>
      <rect x="20" y="62" width="104" height="38" rx="6" fill="#181413" stroke="#4a403c"/>
      <circle cx="40" cy="81" r="6" fill="none" stroke="#e0906c" stroke-width="1.6"/>
      <text x="56" y="78" font-size="9.5" fill="#d8cac2">MQ2</text>
      <text x="56" y="90" font-size="7.6" fill="#7a6a62">gas ppm</text>

      <rect x="20" y="112" width="104" height="38" rx="6" fill="#181413" stroke="#4a403c"/>
      <path d="M40 124a7 7 0 0 1 7 7c0 5-7 12-7 12s-7-7-7-12a7 7 0 0 1 7-7z" fill="none" stroke="#e0906c" stroke-width="1.5"/>
      <text x="56" y="128" font-size="9.5" fill="#d8cac2">NEO-6M</text>
      <text x="56" y="140" font-size="7.6" fill="#7a6a62">lat / lon</text>

      <rect x="20" y="162" width="104" height="38" rx="6" fill="#181413" stroke="#4a403c"/>
      <path d="M32 181h6l3-7 4 14 4-9 3 2h6" fill="none" stroke="#e0906c" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="56" y="178" font-size="9.5" fill="#d8cac2">pulse</text>
      <text x="56" y="190" font-size="7.6" fill="#7a6a62">bpm</text>

      <rect x="20" y="212" width="104" height="38" rx="6" fill="#181413" stroke="#4a403c"/>
      <path d="M34 232l6-12 6 8 6-14" fill="none" stroke="#e0906c" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="60" y="228" font-size="9.5" fill="#d8cac2">IMU</text>
      <text x="60" y="240" font-size="7.6" fill="#7a6a62">free-fall</text>
    </g>

    <g fill="none" stroke="#7a6a62" stroke-width="1.3" marker-end="url(#es-arrow)">
      <path d="M124 81h44v58h8"/>
      <path d="M124 131h52"/>
      <path d="M124 181h44v-38h8"/>
      <path d="M124 231h44v-84h8"/>
    </g>

    <!-- esp32 board -->
    <rect x="184" y="92" width="132" height="120" rx="8" fill="#141a17" stroke="#7f9c8a" stroke-width="1.4"/>
    <rect x="200" y="112" width="100" height="52" rx="4" fill="#0f1412" stroke="#4a5c52"/>
    <text x="250" y="134" font-size="12" fill="#a9c4b4" text-anchor="middle" font-weight="700">ESP32</text>
    <text x="250" y="150" font-size="8" fill="#6f8a7a" text-anchor="middle">fusion + threshold</text>
    <g stroke="#4a5c52" stroke-width="1.1">
      <path d="M184 104h-8M184 120h-8M184 136h-8M184 152h-8M184 168h-8M184 184h-8"/>
      <path d="M316 104h8M316 120h8M316 136h8M316 152h8M316 168h8M316 184h8"/>
    </g>
    <text x="250" y="184" font-size="8" fill="#6f8a7a" text-anchor="middle">embedded C · RTOS loop</text>
    <text x="250" y="200" font-size="7.6" fill="#4a5c52" text-anchor="middle">patent filed</text>

    <!-- lora radio -->
    <path d="M316 152h36" fill="none" stroke="#7a6a62" stroke-width="1.3" marker-end="url(#es-arrow)"/>
    <g stroke="#c9724f" fill="none" stroke-width="1.6" stroke-linecap="round">
      <path d="M368 132a30 30 0 0 1 0 40"/>
      <path d="M380 122a46 46 0 0 1 0 60"/>
      <path d="M392 112a62 62 0 0 1 0 80"/>
    </g>
    <circle cx="362" cy="152" r="4.5" fill="#e0906c"/>
    <text x="380" y="206" font-size="9" fill="#8a7a72" text-anchor="middle">LoRaWAN</text>
    <text x="380" y="218" font-size="7.6" fill="#5c4f49" text-anchor="middle">SF9 · 868 MHz</text>

    <!-- gateway + dashboard -->
    <rect x="440" y="62" width="180" height="76" rx="8" fill="#151110" stroke="#3a2f2a"/>
    <text x="456" y="84" font-size="9.5" fill="#f5c6a5">gateway &#8594; network server</text>
    <g font-size="8" fill="#7a6a62">
      <text x="456" y="102">gas 412 ppm</text><text x="604" y="102" text-anchor="end" fill="#e0906c">ALERT</text>
      <text x="456" y="118">bpm 138</text><text x="604" y="118" text-anchor="end" fill="#c9a24f">HIGH</text>
      <text x="456" y="132">fix 59.33N 18.06E</text>
    </g>

    <!-- fall chain -->
    <rect x="440" y="152" width="180" height="96" rx="8" fill="#151110" stroke="#3a2f2a"/>
    <text x="456" y="172" font-size="9.5" fill="#f5c6a5">high-altitude fall chain</text>
    <g font-size="8.5" fill="#b9a89f">
      <text x="456" y="194">free-fall &gt; 0.4 s</text>
      <text x="456" y="212">confirm &#8212; IMU + baro</text>
      <text x="456" y="230">actuator deploy</text>
    </g>
    <g fill="#7f9c8a">
      <circle cx="604" cy="191" r="3"/><circle cx="604" cy="209" r="3"/>
    </g>
    <circle cx="604" cy="227" r="3" fill="#e0906c"/>
    <text x="440" y="264" font-size="7.6" fill="#5c4f49">design patent granted</text>

    <rect x="20" y="278" width="600" height="26" rx="6" fill="#151110" stroke="#3a2f2a"/>
    <text x="32" y="294.5" font-size="9" fill="#8a7a72">two devices · two patents · hazardous-environment telemetry</text>

    <rect x="0.5" y="0.5" width="639" height="319" rx="10" fill="none" stroke="#3a2f2a"/>
  </g>
</svg>
