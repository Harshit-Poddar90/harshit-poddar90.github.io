<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img"
     aria-label="Lung CT slice with two detection boxes labelled malignant and benign, plus a tumour measurement callout.">
  <defs>
    <radialGradient id="lm-tissue" cx="50%" cy="50%" r="60%">
      <stop offset="0%"  stop-color="#3a3330"/>
      <stop offset="70%" stop-color="#221d1b"/>
      <stop offset="100%" stop-color="#141110"/>
    </radialGradient>
    <radialGradient id="lm-nodule" cx="50%" cy="45%" r="55%">
      <stop offset="0%"  stop-color="#f0cbb6"/>
      <stop offset="55%" stop-color="#c9724f"/>
      <stop offset="100%" stop-color="#c9724f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="lm-frame"><rect width="640" height="320" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#lm-frame)" font-family="ui-monospace, 'Fira Code', monospace">
    <rect width="640" height="320" fill="#0d0b0a"/>

    <!-- scan grid -->
    <g stroke="#c9724f" stroke-opacity="0.07">
      <path d="M0 40h640M0 80h640M0 120h640M0 160h640M0 200h640M0 240h640M0 280h640"/>
      <path d="M40 0v320M80 0v320M120 0v320M160 0v320M200 0v320M240 0v320M280 0v320M320 0v320M360 0v320M400 0v320M440 0v320M480 0v320M520 0v320M560 0v320M600 0v320"/>
    </g>

    <!-- thorax -->
    <ellipse cx="248" cy="164" rx="176" ry="128" fill="url(#lm-tissue)" stroke="#4a403c" stroke-width="1.5"/>
    <!-- lung fields -->
    <path d="M186 78c-40 16-56 62-54 104 2 40 18 66 44 72 18 4 26-10 28-34 3-42 0-92-4-124-1-14-6-22-14-18z"
          fill="#181413" stroke="#5c4f49" stroke-width="1.5"/>
    <path d="M310 78c40 16 56 62 54 104-2 40-18 66-44 72-18 4-26-10-28-34-3-42 0-92 4-124 1-14 6-22 14-18z"
          fill="#181413" stroke="#5c4f49" stroke-width="1.5"/>
    <!-- vasculature -->
    <g stroke="#6b5a52" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-opacity="0.8">
      <path d="M196 118c14 12 20 30 22 52M200 160c12 6 20 18 24 34M300 118c-14 12-20 30-22 52M296 160c-12 6-20 18-24 34"/>
    </g>
    <!-- mediastinum -->
    <ellipse cx="248" cy="176" rx="26" ry="46" fill="#241e1b" stroke="#5c4f49" stroke-width="1.2"/>

    <!-- nodules -->
    <circle cx="204" cy="140" r="21" fill="url(#lm-nodule)"/>
    <circle cx="313" cy="205" r="13" fill="#8c6a58" opacity="0.75"/>

    <!-- detection box 1 -->
    <g stroke="#e0906c" fill="none" stroke-width="2">
      <rect x="176" y="112" width="57" height="57" rx="2"/>
      <path d="M176 126v-14h14M219 112h14v14M233 155v14h-14M190 169h-14v-14" stroke="#f5c6a5" stroke-width="3.5"/>
    </g>
    <rect x="176" y="94" width="132" height="17" rx="2" fill="#e0906c"/>
    <text x="182" y="106.5" font-size="11" font-weight="700" fill="#1a0f0a">malignant 0.91</text>

    <!-- detection box 2 -->
    <g stroke="#7f9c8a" fill="none" stroke-width="1.6">
      <rect x="295" y="187" width="37" height="37" rx="2"/>
    </g>
    <rect x="295" y="171" width="96" height="15" rx="2" fill="#7f9c8a"/>
    <text x="300" y="182.5" font-size="10" font-weight="700" fill="#0d1410">benign 0.74</text>

    <!-- measurement callout -->
    <g stroke="#f5c6a5" stroke-width="1.2" stroke-dasharray="3 3">
      <path d="M233 140h176"/>
    </g>
    <circle cx="204" cy="140" r="2.6" fill="#f5c6a5"/>

    <!-- readout panel -->
    <rect x="416" y="40" width="196" height="240" rx="8" fill="#151110" stroke="#3a2f2a"/>
    <text x="432" y="66" font-size="10" letter-spacing="1.6" fill="#8a7a72">QUANTITATIVE ASSESSMENT</text>
    <path d="M432 76h164" stroke="#3a2f2a"/>

    <g font-size="11" fill="#b9a89f">
      <text x="432" y="100">diameter</text><text x="596" y="100" text-anchor="end" fill="#f5c6a5">24.3 mm</text>
      <text x="432" y="124">area</text>    <text x="596" y="124" text-anchor="end" fill="#f5c6a5">463 mm²</text>
      <text x="432" y="148">perimeter</text><text x="596" y="148" text-anchor="end" fill="#f5c6a5">78.1 mm</text>
      <text x="432" y="172">volume</text>  <text x="596" y="172" text-anchor="end" fill="#f5c6a5">7.5 cm³</text>
      <text x="432" y="196">mass</text>    <text x="596" y="196" text-anchor="end" fill="#f5c6a5">7.9 g</text>
    </g>

    <path d="M432 214h164" stroke="#3a2f2a"/>
    <g font-size="10" fill="#8a7a72">
      <text x="432" y="236">mAP@0.5</text><text x="596" y="236" text-anchor="end" fill="#e0906c" font-weight="700">91.05%</text>
      <text x="432" y="256">inference</text><text x="596" y="256" text-anchor="end" fill="#e0906c" font-weight="700">2.35 ms</text>
    </g>

    <!-- backbone caption -->
    <rect x="16" y="288" width="290" height="18" rx="4" fill="#151110" stroke="#3a2f2a"/>
    <text x="24" y="301" font-size="9.5" fill="#8a7a72">EfficientNet-B3 + Swin + CBAM &#8594; YOLOv11</text>

    <rect x="0.5" y="0.5" width="639" height="319" rx="10" fill="none" stroke="#3a2f2a"/>
  </g>
</svg>
