<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img"
     aria-label="Macro-F1 of a ballroom-dance classifier as the music is time-stretched: rhythm features fall from 82% to 18% at +10% tempo, tempo-only from 65% to 13%, while timbral features stay near 47%.">
  <defs>
    <clipPath id="ts-frame"><rect width="640" height="320" rx="10"/></clipPath>
    <!-- Steps through the stretch levels; each state shows where the three models land.
         Numbers: tuned Random Forest, mean of 5 test folds (README table 7.2). -->
    <style>
      .st { opacity: 0; animation: st 8.8s infinite; }
      @keyframes st { 0%, 12.4% { opacity: 1; } 12.5%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .st0 { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#ts-frame)" font-family="ui-monospace, 'Fira Code', monospace">
    <rect width="640" height="320" fill="#0d0b0a"/>

    <text x="20" y="28" font-size="10" letter-spacing="1.8" fill="#8a7a72">RHYTHM OR JUST TEMPO? · MACRO-F1 UNDER TIME-STRETCH</text>
    <path d="M20 38h600" stroke="#3a2f2a"/>

    <!-- axes: x = 240 + 18·tempo%, y = 276 − 2.2·F1% -->
    <g stroke="#2a2320">
      <path d="M60 56h360M60 111h360M60 166h360M60 221h360"/>
    </g>
    <path d="M60 276h360" stroke="#4a403c"/>
    <g font-size="8.5" fill="#7a6a62" text-anchor="end">
      <text x="52" y="59">100</text><text x="52" y="114">75</text><text x="52" y="169">50</text>
      <text x="52" y="224">25</text><text x="52" y="279">0</text>
    </g>
    <g font-size="8.5" fill="#7a6a62" text-anchor="middle">
      <text x="60" y="290">−10</text><text x="150" y="290">−5</text><text x="204" y="290">−2</text>
      <text x="240" y="290">0</text><text x="276" y="290">+2</text><text x="330" y="290">+5</text><text x="420" y="290">+10</text>
      <text x="240" y="306" fill="#8a7a72">tempo change (%)</text>
    </g>
    <path d="M60 248.5h360" stroke="#5c4f49" stroke-dasharray="2 3"/>
    <text x="416" y="244" font-size="8" fill="#5c4f49" text-anchor="end">chance 12.5%</text>

    <!-- curves -->
    <g fill="none" stroke-width="2" stroke-linejoin="round">
      <polyline stroke="#7f9c8a" points="60,173.7 150,173.7 204,175.2 240,170.4 276,173.9 330,172.6 420,175"/>
      <polyline stroke="#c9a24f" points="60,227.6 150,202.7 204,170.8 240,133.4 276,167.3 330,218.1 420,248.5"/>
      <polyline stroke="#e0906c" points="60,224.7 150,173.3 204,136.5 240,96 276,130.1 330,182.7 420,237.1"/>
    </g>

    <!-- readout panel -->
    <rect x="440" y="56" width="180" height="220" rx="8" fill="#151110" stroke="#3a2f2a"/>
    <text x="454" y="74" font-size="8.5" letter-spacing="1.2" fill="#8a7a72">RANDOM FOREST · TUNED</text>
    <g font-size="10">
      <rect x="454" y="122" width="8" height="8" rx="1.5" fill="#e0906c"/><text x="468" y="130" fill="#d8cac2">rhythm</text>
      <rect x="454" y="148" width="8" height="8" rx="1.5" fill="#c9a24f"/><text x="468" y="156" fill="#d8cac2">tempo only</text>
      <rect x="454" y="174" width="8" height="8" rx="1.5" fill="#7f9c8a"/><text x="468" y="182" fill="#d8cac2">timbral</text>
    </g>
    <path d="M454 200h152" stroke="#3a2f2a"/>
    <g font-size="8.5" fill="#8a7a72">
      <text x="454" y="220">Same music, only faster</text>
      <text x="454" y="234">or slower. Rhythm follows</text>
      <text x="454" y="248">the tempo; timbre does not.</text>
      <text x="454" y="266" fill="#5c4f49">698 clips · 8 dances · 5-fold CV</text>
    </g>

    <!-- states: marker, dots, readout values -->
    <g font-weight="700">
      <g class="st st0">
        <path d="M240 56v220" stroke="#f5c6a5" stroke-dasharray="3 3"/>
        <circle cx="240" cy="96" r="4.5" fill="#e0906c"/><circle cx="240" cy="133.4" r="4.5" fill="#c9a24f"/><circle cx="240" cy="170.4" r="4.5" fill="#7f9c8a"/>
        <text x="454" y="102" font-size="13" fill="#f5c6a5">original tempo</text>
        <g font-size="10" text-anchor="end"><text x="606" y="130" fill="#e0906c">82%</text><text x="606" y="156" fill="#c9a24f">65%</text><text x="606" y="182" fill="#7f9c8a">48%</text></g>
      </g>
      <g class="st" style="animation-delay:1.1s">
        <path d="M276 56v220" stroke="#f5c6a5" stroke-dasharray="3 3"/>
        <circle cx="276" cy="130.1" r="4.5" fill="#e0906c"/><circle cx="276" cy="167.3" r="4.5" fill="#c9a24f"/><circle cx="276" cy="173.9" r="4.5" fill="#7f9c8a"/>
        <text x="454" y="102" font-size="13" fill="#f5c6a5">tempo +2%</text>
        <g font-size="10" text-anchor="end"><text x="606" y="130" fill="#e0906c">66%</text><text x="606" y="156" fill="#c9a24f">49%</text><text x="606" y="182" fill="#7f9c8a">46%</text></g>
      </g>
      <g class="st" style="animation-delay:2.2s">
        <path d="M330 56v220" stroke="#f5c6a5" stroke-dasharray="3 3"/>
        <circle cx="330" cy="182.7" r="4.5" fill="#e0906c"/><circle cx="330" cy="218.1" r="4.5" fill="#c9a24f"/><circle cx="330" cy="172.6" r="4.5" fill="#7f9c8a"/>
        <text x="454" y="102" font-size="13" fill="#f5c6a5">tempo +5%</text>
        <g font-size="10" text-anchor="end"><text x="606" y="130" fill="#e0906c">42%</text><text x="606" y="156" fill="#c9a24f">26%</text><text x="606" y="182" fill="#7f9c8a">47%</text></g>
      </g>
      <g class="st" style="animation-delay:3.3s">
        <path d="M420 56v220" stroke="#f5c6a5" stroke-dasharray="3 3"/>
        <circle cx="420" cy="237.1" r="4.5" fill="#e0906c"/><circle cx="420" cy="248.5" r="4.5" fill="#c9a24f"/><circle cx="420" cy="175" r="4.5" fill="#7f9c8a"/>
        <text x="454" y="102" font-size="13" fill="#f5c6a5">tempo +10%</text>
        <g font-size="10" text-anchor="end"><text x="606" y="130" fill="#e0906c">18%</text><text x="606" y="156" fill="#c9a24f">13%</text><text x="606" y="182" fill="#7f9c8a">46%</text></g>
      </g>
      <g class="st" style="animation-delay:4.4s">
        <path d="M240 56v220" stroke="#f5c6a5" stroke-dasharray="3 3"/>
        <circle cx="240" cy="96" r="4.5" fill="#e0906c"/><circle cx="240" cy="133.4" r="4.5" fill="#c9a24f"/><circle cx="240" cy="170.4" r="4.5" fill="#7f9c8a"/>
        <text x="454" y="102" font-size="13" fill="#f5c6a5">original tempo</text>
        <g font-size="10" text-anchor="end"><text x="606" y="130" fill="#e0906c">82%</text><text x="606" y="156" fill="#c9a24f">65%</text><text x="606" y="182" fill="#7f9c8a">48%</text></g>
      </g>
      <g class="st" style="animation-delay:5.5s">
        <path d="M204 56v220" stroke="#f5c6a5" stroke-dasharray="3 3"/>
        <circle cx="204" cy="136.5" r="4.5" fill="#e0906c"/><circle cx="204" cy="170.8" r="4.5" fill="#c9a24f"/><circle cx="204" cy="175.2" r="4.5" fill="#7f9c8a"/>
        <text x="454" y="102" font-size="13" fill="#f5c6a5">tempo −2%</text>
        <g font-size="10" text-anchor="end"><text x="606" y="130" fill="#e0906c">63%</text><text x="606" y="156" fill="#c9a24f">48%</text><text x="606" y="182" fill="#7f9c8a">46%</text></g>
      </g>
      <g class="st" style="animation-delay:6.6s">
        <path d="M150 56v220" stroke="#f5c6a5" stroke-dasharray="3 3"/>
        <circle cx="150" cy="173.3" r="4.5" fill="#e0906c"/><circle cx="150" cy="202.7" r="4.5" fill="#c9a24f"/><circle cx="150" cy="173.7" r="4.5" fill="#7f9c8a"/>
        <text x="454" y="102" font-size="13" fill="#f5c6a5">tempo −5%</text>
        <g font-size="10" text-anchor="end"><text x="606" y="130" fill="#e0906c">47%</text><text x="606" y="156" fill="#c9a24f">33%</text><text x="606" y="182" fill="#7f9c8a">47%</text></g>
      </g>
      <g class="st" style="animation-delay:7.7s">
        <path d="M60 56v220" stroke="#f5c6a5" stroke-dasharray="3 3"/>
        <circle cx="60" cy="224.7" r="4.5" fill="#e0906c"/><circle cx="60" cy="227.6" r="4.5" fill="#c9a24f"/><circle cx="60" cy="173.7" r="4.5" fill="#7f9c8a"/>
        <text x="454" y="102" font-size="13" fill="#f5c6a5">tempo −10%</text>
        <g font-size="10" text-anchor="end"><text x="606" y="130" fill="#e0906c">23%</text><text x="606" y="156" fill="#c9a24f">22%</text><text x="606" y="182" fill="#7f9c8a">47%</text></g>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="639" height="319" rx="10" fill="none" stroke="#3a2f2a"/>
  </g>
</svg>
